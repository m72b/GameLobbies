[package]
name = "game-lobby"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A unified local game library and launcher"
publish = false

[lib]
name = "game_lobby_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
regex = "1"
url = "2"
anyhow = "1"
tokio = { version = "1", features = ["time", "sync", "process", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
percent-encoding = "2"
# Signed self-updates; driven only from Rust (src/updater.rs). Native TLS like the rest of the app;
# no zip support (Tauri 2 NSIS updates are plain setup .exe files).
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "1"
# Local cover cache (src/covercache.rs): file names from SHA-256, downscaling of large static
# covers. Only the decoders/encoders that are needed; no rayon, no other formats.
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-single-instance = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Foundation_Collections",
  "Management_Deployment",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
